name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # ---------------- DETECT CHANGES ----------------

      - name: Detect changed services
        id: changes
        shell: powershell
        run: |

          $changedFiles = git diff --name-only HEAD^ HEAD

          Write-Host "Changed files:"
          $changedFiles

          if ($changedFiles -match '^frontend/') {
              "frontend=true" >> $env:GITHUB_OUTPUT
          }
          else {
              "frontend=false" >> $env:GITHUB_OUTPUT
          }

          if ($changedFiles -match '^backend/') {
              "backend=true" >> $env:GITHUB_OUTPUT
          }
          else {
              "backend=false" >> $env:GITHUB_OUTPUT
          }

      - name: Show detected services
        run: |
          echo "Commit SHA: $env:IMAGE_TAG"
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"

      # ---------------- FRONTEND ----------------

      - name: Pull frontend image
        if: steps.changes.outputs.frontend == 'true'
        env:
          FRONTEND_TAG: ${{ env.IMAGE_TAG }}
          BACKEND_TAG: latest
        run: |
          docker compose -f docker-compose.deploy.yml pull frontend

      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        env:
          FRONTEND_TAG: ${{ env.IMAGE_TAG }}
          BACKEND_TAG: latest
        run: |
          docker compose -f docker-compose.deploy.yml up -d --no-deps frontend

      # ---------------- BACKEND ----------------

      - name: Pull backend image
        if: steps.changes.outputs.backend == 'true'
        env:
          FRONTEND_TAG: latest
          BACKEND_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker compose -f docker-compose.deploy.yml pull backend

      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true'
        env:
          FRONTEND_TAG: latest
          BACKEND_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker compose -f docker-compose.deploy.yml up -d --no-deps backend

      # ---------------- STATUS ----------------

      - name: Show running containers
        env:
          FRONTEND_TAG: latest
          BACKEND_TAG: latest
        run: |
          docker compose -f docker-compose.deploy.yml ps