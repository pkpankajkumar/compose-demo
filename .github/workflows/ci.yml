name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build frontend Docker image
        run: docker compose build frontend  
