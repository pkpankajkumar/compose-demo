name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build backend with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Build Docker images
        run: docker compose build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        run: docker tag fbs-api:3.0 pankajkumar384/fbs-api:latest

      - name: Tag frontend image
        run: docker tag my-hello-world:2.0 pankajkumar384/my-hello-world:latest

      - name: Push backend image
        run: docker push pankajkumar384/fbs-api:latest

      - name: Push frontend image
        run: docker push pankajkumar384/my-hello-world:latest

      - name: Show Docker images after push
        run: docker images