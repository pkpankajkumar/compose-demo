name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show files
        run: ls -la

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          echo "Changed files:"
          git diff --name-only HEAD^ HEAD

          if git diff --name-only HEAD^ HEAD | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show detected changes
        run: |
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"

      - name: Validate Docker Compose
        run: docker compose config

      # ---------------- BACKEND ----------------

      - name: Set up Java 11
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build backend with Maven
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Build backend Docker image
        if: steps.changes.outputs.backend == 'true'
        run: docker compose build backend

      # ---------------- FRONTEND ----------------

      - name: Build frontend Docker image
        if: steps.changes.outputs.frontend == 'true'
        run: docker compose build frontend

      # ---------------- DOCKER HUB ----------------

      - name: Login to Docker Hub
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        if: steps.changes.outputs.backend == 'true'
        run: docker tag fbs-api:3.0 pankajkumar384/fbs-api:${{ github.sha }}

      - name: Tag frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: docker tag my-hello-world:2.0 pankajkumar384/my-hello-world:${{ github.sha }}

      - name: Push backend image
        if: steps.changes.outputs.backend == 'true'
        run: docker push pankajkumar384/fbs-api:${{ github.sha }}

      - name: Push frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: docker push pankajkumar384/my-hello-world:${{ github.sha }}

      - name: Show Docker images
        run: docker images